name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net10.0-windows10.0.19041.0
          - net10.0-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the MAUI workload
        run: dotnet workload install maui

      - name: Build
        run: dotnet build Casdoor.MauiOidcClient.Example/Casdoor.MauiOidcClient.Example.csproj -c Release -f ${{ matrix.framework }}
